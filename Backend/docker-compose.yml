version: '3.8'

services:
  job-app-applicant:
    build:
      context: ./job-app-applicant
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    networks:
      - job-app-network

  job-app-company:
    build:
      context: ./job-app-company
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8082:8082"
    networks:
      - job-app-network

  postgres:
    build: .
    image: postgres
    container_name: postgresdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    networks:
      - job-app-network

networks:
  job-app-network:
    driver: bridge
